# Run on Linux/Mac — Docker on Windows requires WSL2
version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=JIod7YC0sLqZxbTggGoTsxB7b2mnfdnNefnw4S65swc=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - DATA_GOV_API_KEY=${DATA_GOV_API_KEY}
    - AIRFLOW_HOME=/opt/airflow
    - RAW_DIR=/opt/airflow/data/raw
    - PROCESSED_DIR=/opt/airflow/data/processed
    - DUCKDB_PATH=/opt/airflow/data/crop_weather.duckdb
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./ingestion:/opt/airflow/ingestion
    - ./transform:/opt/airflow/transform
    - ./db:/opt/airflow/db
    - ./models:/opt/airflow/models
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow" ]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # Run db init and create default admin account on first boot
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin

  dashboard:
    build:
      context: .
      dockerfile: ./dashboard/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DUCKDB_PATH=/app/data/crop_weather.duckdb
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./data:/app/data
      - ./dashboard:/app/dashboard
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./models:/app/models
      - ./scripts:/app/scripts
      - ./db:/app/db
    depends_on:
      - airflow-webserver
